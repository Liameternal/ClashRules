proxy-groups:
- name: 🚀 节点选择
  proxies:
  - 🚀 手动切换
  - DIRECT
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  type: select
- name: 🚀 手动切换
  include-all: true
  type: select
- name: 🤖 AI
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  type: select
- name: 📲 电报消息
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  type: select
- name: 📹 油管视频
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  type: select
- name: 🌍 国外媒体
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  type: select
- name: Ⓜ️ 微软服务
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  - DIRECT
  type: select
- name: 🎮 游戏平台
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  - DIRECT
  type: select
- name: 🐟 漏网之鱼
  proxies:
  - 🚀 节点选择
  - 🚀 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  - 🇰🇷 其他节点
  - DIRECT
  type: select
- interval: 60
  name: 🇭🇰 香港节点
  include-all: true
  filter: "(?i)港|hk|hongkong|hong kong"
  exclude-filter: "(?i)V1|V2|备用|福利"
  tolerance: 50
  type: url-test
  url: https://www.google.com/generate_204
- interval: 60
  name: 🇯🇵 日本节点
  include-all: true
  filter: "(?i)日|日本|jp|tokyo|东京"
  exclude-filter: "(?i)V1|V2|备用|福利"
  tolerance: 50
  type: url-test
  url: https://www.google.com/generate_204
- interval: 60
  name: 🇺🇲 美国节点
  include-all: true
  filter: "(?i)美|美国|硅谷|us|united states"
  exclude-filter: "(?i)V1|V2|备用|福利"
  tolerance: 50
  type: url-test
  url: https://www.google.com/generate_204
- interval: 60
  name: 🇨🇳 台湾节点
  include-all: true
  filter: "(?i)台|台湾|tw|taiwan"
  exclude-filter: "(?i)V1|V2|备用|福利"
  tolerance: 50
  type: url-test
  url: https://www.google.com/generate_204
- interval: 60
  name: 🇸🇬 新加坡节点
  include-all: true
  filter: "(?i)新|新加坡|sg|singapore"
  exclude-filter: "(?i)V1|V2|备用|福利"
  tolerance: 50
  type: url-test
  url: https://www.google.com/generate_204
- name: 🇰🇷 其他节点
  include-all: true
  exclude-filter: "(?i)V1|V2|港|hk|hongkong|hong kong|日|日本|jp|tokyo|东京|美|美国|硅谷|us|united states|台|台湾|tw|taiwan|新|新加坡|sg|singapore|备用|福利"
  type: select
